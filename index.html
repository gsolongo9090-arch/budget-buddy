<!DOCTYPE html>
<html>
<head>
  <title>Budget Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>My Money Dashboard</h1>
  <p class="subtitle">Manage your money wisely.</p>
<div class="container">
  <div class="income">
    <h2 id="income-title">My Income</h2>
    <label for="income-input">Enter your income:</label>
    <input type="number" id="income-input" placeholder="e.g 2500">
    <button id="add-income">Add Income</button>
    <p>Total Income: €<span id="total-income">0</p>
  <ul>
    <li>Salary</li>
    <li>freelance</li>
    <li>Other income</li>
  </ul>
  </div>
  <div class="expenses">
    <h2>My Expenses</h2>
    <p>Monthly expenses are 1400.</p>
   <ol>
    <li>Food</li>
    <li>Transport</li>
    <li>Shopping</li>
  </ol>
  </div>
  <div class="balance">
    <h2>My Balance</h2>
    <p>I have 1100 left.</p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
